{% extends "base.html" %}

{% block title %}Add Website - Postura{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="fw-bold mb-4">Add a Website to Scan</h2>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="url" class="form-label fw-semibold">Target Website URL</label>
                        <input type="url" class="form-control" id="url" name="url" value="{{ url }}"
                               placeholder="https://example.com" required>
                        <div class="form-text text-muted">Include http:// or https://. Target hostname must resolve to a public IP address.</div>
                    </div>
                    <div class="mb-4">
                        <label for="project_id" class="form-label fw-semibold">Project Container</label>
                        <select class="form-select" id="project_id" name="project_id" required>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-primary px-4">Add Website</button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
