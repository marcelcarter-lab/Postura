{% extends "base.html" %}

{% block title %}Add Website - Postura{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="{{ url_for('main.dashboard') }}" class="text-secondary hover-text-primary text-decoration-none">&larr; Back</a>
        </div>
        <h2 class="fw-bold mb-4">Register Target Website</h2>

        <div class="card border-glow shadow-lg">
            <div class="card-body p-5">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label for="url" class="form-label">Target Website URL</label>
                        <input type="url" class="form-control" id="url" name="url" value="{{ url }}"
                               placeholder="https://example.com" required>
                        <div class="form-text">Include http:// or https://. Target hostname must resolve to a public IP address.</div>
                    </div>
                    <div class="mb-4">
                        <label for="project_id" class="form-label">Project Container</label>
                        <select class="form-select" id="project_id" name="project_id" required>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex align-items-center gap-3 mt-5">
                        <button type="submit" class="btn btn-primary px-4 shadow">Add Website</button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
