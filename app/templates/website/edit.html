{% extends "base.html" %}

{% block title %}Edit Website - Postura{% endblock %}

{% block content %}
<h2 class="mb-4">Edit website</h2>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="name" class="form-label">Name (optional)</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ name }}"
               placeholder="e.g. Client X — Marketing Site">
    </div>
    <div class="mb-3">
        <label for="url" class="form-label">Website URL</label>
        <input type="url" class="form-control" id="url" name="url" value="{{ url }}"
               placeholder="https://example.com" required>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="schedule_enabled" name="schedule_enabled"
               {% if website.frequency %}checked{% endif %}>
        <label class="form-check-label" for="schedule_enabled">
            Enable automatic scanning
        </label>
    </div>

    <div class="mb-3">
        <label for="frequency" class="form-label">Scan frequency</label>
        <select class="form-select" id="frequency" name="frequency">
            <option value="daily" {% if website.frequency == "daily" or not website.frequency %}selected{% endif %}>Daily</option>
            <option value="weekly" {% if website.frequency == "weekly" %}selected{% endif %}>Weekly</option>
            <option value="monthly" {% if website.frequency == "monthly" %}selected{% endif %}>Monthly</option>
        </select>
        {% if website.frequency and website.next_run_at %}
        <div class="form-text">
            Next scan: {{ website.next_run_at.strftime('%Y-%m-%d %H:%M UTC') }}.
        </div>
        {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-link">Cancel</a>
</form>

<hr class="my-4">
<form method="post" action="{{ url_for('website.delete_website', website_id=website.id) }}"
      onsubmit="return confirm('Delete this website and all its scan history? This cannot be undone.');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-danger">Delete Website</button>
</form>
{% endblock %}
