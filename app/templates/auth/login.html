{% extends "base.html" %}

{% block title %}Log in - Postura{% endblock %}

{% block container_class %}auth-card{% endblock %}

{% block content %}
<div class="card shadow-lg border-glow animate-fade-in">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <div class="brand-badge-container mb-3 d-inline-block">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Postura Logo" class="rounded-3 shadow-lg" style="height: 80px; width: 80px; object-fit: contain; border: 1px solid rgba(255,255,255,0.15);">
            </div>
            <h3 class="fw-bold mt-2">Log in to Postura</h3>
            <p class="text-secondary small">Enter your credentials to access security posture reports</p>
        </div>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2.5">Log in</button>
        </form>
        <p class="mt-4 mb-0 text-center small text-secondary">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
