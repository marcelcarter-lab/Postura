{% extends "base.html" %}

{% block title %}Log in - Postura{% endblock %}

{% block container_class %}auth-card{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <span class="fs-1">🛡️</span>
            <h3 class="fw-bold mt-2">Log in to Postura</h3>
            <p class="text-muted small">Enter your credentials to access security posture reports</p>
        </div>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
        </form>
        <p class="mt-4 mb-0 text-center small text-muted">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
