[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: tests that make real network calls to external services (badssl.com) and require internet access; TLS-version/cipher tests also shell out to sslscan and can take 1-3+ minutes total.
    integration: tests that require the test-target Docker Compose service to be running (docker compose up -d test-target).
