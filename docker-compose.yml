version: "3.9"

services:
  web:
    build: .
    container_name: postura_web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: postura_db
    environment:
      POSTGRES_USER: postura_user
      POSTGRES_PASSWORD: postura_pass
      POSTGRES_DB: postura_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postura_user -d postura_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-target:
    build: ./test_target
    container_name: postura_test_target
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: